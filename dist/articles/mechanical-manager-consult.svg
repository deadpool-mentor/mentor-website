<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">무료 학습계획표 상담</title>
  <desc id="desc">정수멘토. 학력과 보유 학점을 확인해 기계설비 분야 자격시험 준비 계획을 안내합니다.</desc>
  <rect width="1000" height="520" rx="28" fill="#e7f5f2"/>
  <rect x="32" y="32" width="936" height="456" rx="22" fill="#fff"/>
  <rect x="65" y="66" width="190" height="48" rx="24" fill="#0b8178"/>
  <text x="160" y="98" text-anchor="middle" fill="#fff" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-weight="700" font-size="23">정수멘토</text>
  <text x="66" y="205" fill="#102c3e" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-weight="900" font-size="56">내 학점부터 확인하고</text>
  <text x="66" y="285" fill="#102c3e" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-weight="900" font-size="56">시험 계획 세우기</text>
  <text x="68" y="360" fill="#3c5d68" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="26">학력 · 보유 학점 · 목표 자격 종목을 알려주세요</text>
  <rect x="67" y="392" width="490" height="60" rx="14" fill="#0b8178"/>
  <text x="312" y="433" text-anchor="middle" fill="#fff" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-weight="800" font-size="26">무료 상담하기  ↗</text>
</svg>
