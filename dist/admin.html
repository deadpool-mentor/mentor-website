<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상담 신청 관리 · 정수멘토</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><header class="admin-header"><a class="brand" href="/"><img class="brand-mark" src="/logo.svg" alt=""><span>정수멘토<small>CONSULTATION DESK</small></span></a><a href="/">홈페이지 보기 ↗</a></header><form class="admin-login" id="adminLogin" hidden><span class="eyebrow">MENTOR ONLY</span><h1>관리 화면 로그인</h1><p>상담 신청 내역을 확인하려면 관리 암호를 입력해 주세요.</p><label>관리 암호<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">로그인</button><p id="loginStatus" role="status"></p></form><main class="admin-main" id="adminMain" hidden><div class="admin-title"><div><span class="eyebrow">CONSULTATION DESK</span><h1>상담 신청 관리</h1><p>신청 정보와 학점계산기 입력 내역을 함께 확인합니다.</p></div><button type="button" id="refresh">새로고침</button></div><p id="adminStatus" role="status">신청 내역을 불러오는 중입니다.</p><div class="admin-layout"><div id="adminList" class="admin-list"></div><article id="adminDetail" class="admin-detail"><p>왼쪽에서 신청을 선택해 주세요.</p></article></div><section class="admin-content"><div class="admin-title"><div><span class="eyebrow">CONTENT</span><h2>게시글 · 학생 후기 관리</h2><p>글을 저장하면 홈페이지에 바로 표시됩니다. 예시 글은 수정하거나 삭제할 수 있습니다.</p></div></div><div class="admin-content-layout"><div id="contentList" class="admin-list"></div><form id="contentForm" class="admin-editor"><h3 id="editorHeading">새 글 작성</h3><input type="hidden" name="id"><label>글 종류<select name="type" required><option value="post">교육과정 안내 글</option><option value="review">학생 후기</option></select></label><label>분류<select name="category" required><option value="학위취득">학위 취득</option><option value="편입">편입</option><option value="자격증">자격증</option></select></label><label>제목<input name="title" maxlength="160" required placeholder="제목을 입력해 주세요"></label><label>본문<textarea name="body" maxlength="10000" required placeholder="내용을 입력해 주세요"></textarea></label><div class="editor-actions"><button class="button button-dark" type="submit">글 저장</button><button type="button" id="resetEditor">새 글 쓰기</button></div><p id="contentStatus" role="status"></p></form></div></section></main><script type="module" src="/admin.js"></script></body></html>
